name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Catch2
        run: sudo apt-get update && sudo apt-get install -y catch2
      - name: Build main
        run: make all
      - name: Run tests
        run: make test